<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>꾸지뽕사업단 관리자</title>
    <meta name="viewport" content="width=1280">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/jquery-2.1.4.min.js"></script>
    <script type="module" src="../js/community_firebase.js?v=20251220_alert_fix"></script>
    <style>
        body {
            background: #f4f6f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .admin-wrap {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #343a40;
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: bold;
            border-bottom: 1px solid #4b545c;
        }

        .nav-link {
            display: block;
            padding: 15px 20px;
            color: #c2c7d0;
            text-decoration: none;
            border-bottom: 1px solid #4b545c;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #494e53;
            color: #fff;
        }

        .content {
            flex-grow: 1;
            padding: 30px;
        }

        .card {
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 0 1px rgba(0, 0, 0, .125), 0 1px 3px rgba(0, 0, 0, .2);
            margin-bottom: 20px;
        }

        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, .125);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .card-body {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .btn {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
        }

        .btn-primary {
            background: #007bff;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea.form-control {
            height: 150px;
            resize: vertical;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #343a40;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div id="login-box">
            <h2 style="margin-bottom: 30px; font-weight: bold;">관리자 로그인</h2>
            <!-- Email Input Removed -->
            <!-- <input type="email" id="admin-email" class="form-control" placeholder="이메일 주소" style="margin-bottom: 15px;"> -->
            <input type="password" id="admin-password" class="form-control" placeholder="비밀번호"
                style="margin-bottom: 20px;">
            <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;"
                onclick="tryLogin()">로그인</button>
            <p id="login-msg" style="color: red; margin-top: 15px; font-size: 14px;"></p>
        </div>
    </div>

    <div class="admin-wrap" id="admin-main" style="filter: blur(5px);">
        <div class="sidebar">
            <div class="sidebar-header">관리자 페이지</div>
            <nav style="flex-grow: 1;">
                <a href="#" class="nav-link active" data-target="dashboard">대시보드</a>
                <a href="#" class="nav-link" data-target="notices">공지사항 관리</a>
                <a href="#" class="nav-link" data-target="inquiries">활동사항 관리</a>
                <a href="#" class="nav-link" data-target="reviews">사용후기 관리</a>
            </nav>
            <a href="#" class="nav-link" onclick="tryLogout()"
                style="background: #c31d22; text-align: center; font-weight: bold;">로그아웃</a>
        </div>

        <div class="content">
            <!-- Dashboard -->
            <div id="dashboard" class="page-section">
                <h2 style="margin-bottom: 20px;">대시보드</h2>
                <div style="display: flex; gap: 20px;">
                    <div class="card" style="flex: 1;">
                        <div class="card-body">
                            <h3>접수된 활동사항</h3>
                            <p style="font-size: 2rem; font-weight: bold; color: #17a2b8;" id="dash-inquiry-count">0</p>
                        </div>
                    </div>
                    <div class="card" style="flex: 1;">
                        <div class="card-body">
                            <h3>등록된 사용후기</h3>
                            <p style="font-size: 2rem; font-weight: bold; color: #ffc107;" id="dash-review-count">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notices -->
            <div id="notices" class="page-section" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">공지사항 관리</h3>
                        <button class="btn btn-primary" onclick="showNoticeForm()">글쓰기</button>
                    </div>
                    <div class="card-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>작성일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="notice-list">
                                <!-- JS populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Inquiries -->
            <div id="inquiries" class="page-section" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">활동사항 관리</h3>
                    </div>
                    <div class="card-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>작성자</th>
                                    <th>제목</th>
                                    <th>상태</th>
                                    <th>작성일</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="inquiry-list">
                                <!-- JS populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Reviews -->
            <div id="reviews" class="page-section" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">사용후기 관리</h3>
                    </div>
                    <div class="card-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>제목</th>
                                    <th>작성자</th>
                                    <th>날짜</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="review-list">
                                <!-- JS populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Notice Write Modal -->
    <div id="notice-form-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="card" style="width: 600px; max-width:90%;">
            <div class="card-header">
                <h3 class="card-title" id="notice-modal-title">공지사항 작성</h3>
                <button class="btn btn-danger" onclick="$('#notice-form-modal').hide();">닫기</button>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" id="notice-title" class="form-control">
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <textarea id="notice-content" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>첨부파일 (이미지)</label>
                    <input type="file" id="notice-file" class="form-control" accept="image/*">
                    <div id="notice-file-preview" style="margin-top:10px;"></div>
                </div>
                <button class="btn btn-success" onclick="saveNoticeBtn()">저장</button>
            </div>
        </div>
    </div>

    <!-- Reply Modal -->
    <div id="reply-form-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="card" style="width: 600px; max-width:90%;">
            <div class="card-header">
                <h3 class="card-title">활동사항 답변하기</h3>
                <button class="btn btn-danger" onclick="$('#reply-form-modal').hide()">닫기</button>
            </div>
            <div class="card-body">
                <div class="form-group" style="background:#f9f9f9; padding:10px; border-radius:5px;">
                    <label>활동사항 제목</label>
                    <p id="reply-inq-title" style="font-weight:bold;"></p>
                    <label style="margin-top:10px;">활동사항 내용</label>
                    <p id="reply-inq-content" style="white-space:pre-wrap; color:#666;"></p>
                </div>
                <div class="form-group">
                    <label>답변 내용</label>
                    <textarea id="reply-content" class="form-control" style="height:100px;"></textarea>
                </div>
                <button class="btn btn-success" onclick="saveReplyBtn()">등록</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="delete-confirm-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:9999;">
        <div class="card" style="width: 300px; text-align:center;">
            <div class="card-body">
                <h3 style="font-size:18px; margin-bottom:20px;">정말 삭제하시겠습니까?</h3>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button class="btn btn-danger" onclick="confirmDelete()">삭제</button>
                    <button class="btn" style="background:#6c757d; color:#fff;"
                        onclick="$('#delete-confirm-modal').hide()">취소</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // FAILSAFE: Global Login Function (Standard Script)
        // This runs regardless of Firebase module success/failure
        // Local function to expose render to global scope
        window.triggerRender = function () {
            renderAll();
        }

        // If global login happened before module load, render now
        if (window.isLoggedIn) {
            renderAll();
        }

        // Window Functions
        window.tryLogin = function () {
            // alert('Debug: TryLogin Clicked'); // Debug check
            // Simple Password Check
            const input = document.getElementById('admin-password');
            const pw = input.value.trim();

            if (!pw) return alert('비밀번호를 입력하세요.');

            if (pw === '4321') {
                // Success
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-main').style.filter = 'none';
                window.isLoggedIn = true; // Set flag for module to check
                if (typeof window.triggerRender === 'function') {
                    window.triggerRender(); // Call module's render function
                }
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                input.value = '';
                input.focus();
            }
        }

        window.tryLogout = function () {
            if (confirm('관리자 로그아웃 하시겠습니까?')) {
                location.reload();
            }
        }

        // Add Enter Key Support
        document.addEventListener('DOMContentLoaded', function () {
            const pwInput = document.getElementById('admin-password');
            if (pwInput) {
                pwInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        tryLogin();
                    }
                });
            }
        });
    </script>

    <script type="module">
        import { COMM_KEYS, getPosts, savePost, deletePost, readFile, addComment, adminLogin, adminLogout, monitorAuth, getPost, isFirebaseInitialized } from '../js/community_firebase.js?v=20251220_alert_fix';

        // State
        let currentAuthUser = null;
        let noticeList = [];
        let inquiryList = [];
        let reviewList = [];

        let currentEditId = null; // For Notices
        let currentReplyId = null; // For Inquiries
        let deleteTargetId = null;
        let deleteTargetBoard = null;

        // Check Init (Disabled for simple mode)
        // if (!isFirebaseInitialized()) { ... }

        // --- AUTH LOGIC (SIMPLIFIED for 4321) ---

        // Removed Firebase Monitor Auth to prevent persistence/freeze
        // monitorAuth((user) => { ... });




        window.tryLogout = function () {
            if (confirm('관리자 로그아웃 하시겠습니까?')) {
                location.reload();
            }
        }

        // Add Enter Key Support
        document.getElementById('admin-password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                tryLogin();
            }
        });

        // --- DATA LOGIC ---

        async function renderAll() {
            // Bypass auth check for simple mode
            // if (!currentAuthUser) return;
            // Fake user for logic compatibility
            currentAuthUser = { email: 'admin@demo.com' };

            // Fetch All
            noticeList = await getPosts(COMM_KEYS.NOTICE);
            inquiryList = await getPosts(COMM_KEYS.INQUIRY);
            reviewList = await getPosts(COMM_KEYS.REVIEW);

            // Dashboard
            document.getElementById('dash-inquiry-count').innerText = inquiryList.length;
            document.getElementById('dash-review-count').innerText = reviewList.length;

            // Notice Table
            const noticeTbody = document.getElementById('notice-list');
            if (noticeList.length === 0) {
                noticeTbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">등록된 공지사항이 없습니다.</td></tr>';
            } else {
                let html = '';
                noticeList.forEach(n => {
                    html += `<tr>
                        <td>${n.title}</td>
                        <td>${n.date}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="showNoticeForm('${n.id}')">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="askDelete('${COMM_KEYS.NOTICE}', '${n.id}')">삭제</button>
                        </td>
                    </tr>`;
                });
                noticeTbody.innerHTML = html;
            }

            // Inquiry Table
            const inquTbody = document.getElementById('inquiry-list');
            if (inquiryList.length === 0) {
                inquTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">접수된 활동사항이 없습니다.</td></tr>';
            } else {
                let html = '';
                inquiryList.forEach(q => {
                    const statusColor = q.status === '답변완료' ? 'blue' : 'red';
                    html += `<tr>
                        <td>${q.author}</td>
                        <td>${q.title}</td>
                        <td><span style="color:${statusColor}">${q.status || '답변대기'}</span></td>
                        <td>${q.date}</td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="showReplyForm('${q.id}')">답변</button>
                            <button class="btn btn-danger btn-sm" onclick="askDelete('${COMM_KEYS.INQUIRY}', '${q.id}')">삭제</button>
                        </td>
                    </tr>`;
                });
                inquTbody.innerHTML = html;
            }

            // Review Table
            const reviewTbody = document.getElementById('review-list');
            if (reviewList.length === 0) {
                reviewTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">등록된 후기가 없습니다.</td></tr>';
            } else {
                let html = '';
                reviewList.forEach(r => {
                    html += `<tr>
                        <td>${r.title}</td>
                        <td>${r.author}</td>
                        <td>${r.date}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="askDelete('${COMM_KEYS.REVIEW}', '${r.id}')">삭제</button>
                        </td>
                    </tr>`;
                });
                reviewTbody.innerHTML = html;
            }
        }

        // Notice Actions
        window.showNoticeForm = async function (id = null) {
            currentEditId = id;
            if (id) {
                const n = noticeList.find(item => item.id == id); // string comparison safe
                if (n) {
                    $('#notice-modal-title').text('공지사항 수정');
                    $('#notice-title').val(n.title);
                    $('#notice-content').val(n.content);
                    $('#notice-file-preview').html(n.file ? `<img src="${n.file.data || ''}" style="max-height:50px;"> 기존파일존재` : '');
                }
            } else {
                $('#notice-modal-title').text('공지사항 작성');
                $('#notice-title').val('');
                $('#notice-content').val('');
                $('#notice-file-preview').html('');
            }
            $('#notice-file').val('');
            $('#notice-form-modal').css('display', 'flex');
        }

        window.saveNoticeBtn = async function () {
            const title = $('#notice-title').val();
            const content = $('#notice-content').val();
            const fileInput = document.getElementById('notice-file');

            if (!title) return alert('제목을 입력하세요.');

            // File Handle
            let fileData = null;
            if (fileInput.files.length > 0) {
                fileData = await readFile(fileInput.files[0]);
            } else if (currentEditId) {
                // Keep existing logic: fetch from DB or find in list
                const old = noticeList.find(n => n.id == currentEditId);
                if (old) fileData = old.file;
            }

            const notice = {
                id: currentEditId || null,
                title: title,
                content: content,
                author: '관리자',
                date: new Date().toISOString().split('T')[0],
                file: fileData
            };

            await savePost(COMM_KEYS.NOTICE, notice);
            alert('저장되었습니다.');
            $('#notice-form-modal').hide();
            renderAll();
        }

        // Inquiry Reply
        window.showReplyForm = function (id) {
            currentReplyId = id;
            const q = inquiryList.find(i => i.id == id);
            if (q) {
                $('#reply-inq-title').text(q.title);
                $('#reply-inq-content').text(q.content);
                $('#reply-content').val('');
                $('#reply-form-modal').css('display', 'flex');
            }
        }

        window.saveReplyBtn = async function () {
            const content = $('#reply-content').val();
            if (!content) return alert('내용을 입력하세요.');

            // Add Comment
            await addComment(COMM_KEYS.INQUIRY, currentReplyId, {
                author: '관리자',
                content: content,
                password: '' // Admin no pw needed
            });

            // Update Status
            // We need to fetch the post, update status, save it.
            const post = await getPost(COMM_KEYS.INQUIRY, currentReplyId);
            if (post) {
                post.status = '답변완료';
                await savePost(COMM_KEYS.INQUIRY, post);
            }

            alert('답변이 등록되었습니다.');
            $('#reply-form-modal').hide();
            renderAll();
        }

        // Delete
        window.askDelete = function (boardKey, id) {
            deleteTargetBoard = boardKey;
            deleteTargetId = id;
            $('#delete-confirm-modal').css('display', 'flex');
        }

        window.confirmDelete = async function () {
            if (deleteTargetBoard && deleteTargetId) {
                await deletePost(deleteTargetBoard, deleteTargetId);
                $('#delete-confirm-modal').hide();
                renderAll();
            }
        }

        // Navigation Tab Logic (jQuery original logic adapted)
        $('.nav-link').click(function (e) {
            const href = $(this).attr('href');
            if (href.startsWith('#')) {
                e.preventDefault();
                $('.nav-link').removeClass('active');
                $(this).addClass('active');
                $('.page-section').hide();
                $('#' + $(this).data('target')).show();
            }
        });

    </script>
</body>

</html>
