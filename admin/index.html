            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .card-body {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,

            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }

        th {

        }

        .btn {
            padding: 5px 10px;

        .btn-primary {

        .btn-warning {

            margin-bottom: 5px;
            font-weight: bold;

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;

        textarea.form-control {

        /* Login Overlay */

        #login-box {
            background: #fff;

            border-radius: 10px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);

        }
    </style>

    <script>
        // FAILSAFE: Global Login Function - Defined early to ensure availability
        window.triggerRender = function () {
            if (window.renderAll && typeof window.renderAll === 'function') {
                window.renderAll();
            }
        }

        // Window Functions - Defined in HEAD to guarantee definition
        window.tryLogin = function () {
            const input = document.getElementById('admin-password');
            const pw = input.value.trim();

            if (!pw) return alert('비밀번호를 입력하세요.');

            if (pw === '4321') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-main').style.filter = 'none';
                window.isLoggedIn = true;
                if (window.triggerRender) window.triggerRender();
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                input.value = '';
                input.focus();
            }
        }
    </script>
</head>

    <!-- Inlined Module for Standalone Compatibility -->
    <script type="module">
        // Import Firebase (ES Modules via CDN for static site)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, query, orderBy, limit, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // firebaseConfig
        const firebaseConfig = {
            apiKey: "AIzaSyDxmxP6LPDM69GdXpCTrv9_WgZllzs3bv8",
            authDomain: "homepage-5534d.firebaseapp.com",
            projectId: "homepage-5534d",
            storageBucket: "homepage-5534d.firebasestorage.app",
            messagingSenderId: "445520729520",
            appId: "1:445520729520:web:30692dc01acc2ee81db275",
            measurementId: "G-RMRC5JHJSL"
        };

        let app, db, auth, storage;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            storage = getStorage(app);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("Firebase Auth State: Signed In", user.uid);
                } else {
                    console.log("Firebase Auth State: Signed Out. Attempting Anonymous Sign-in...");
                    signInAnonymously(auth).catch((error) => {
                        console.error("Anonymous Sign-in Failed:", error);
                    });
                }
            });
            console.log("Firebase Initialized");
        } catch (e) {
            console.error("Firebase Init Error:", e);
            alert("치명적 오류: 파이어베이스 초기화 실패.\n" + e.message);
        }

        const COMM_KEYS = { NOTICE: 'notices', INQUIRY: 'inquiries', REVIEW: 'reviews', COMMENTS: 'comments' };

        function readFile(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(null); return; }
                if (file.size > 300 * 1024) {
                    alert("첨부 파일 용량이 300KB를 초과하여 (서버 저장 실패 시) 파일명만 저장됩니다.\n안정적인 저장을 위해 이미지 용량을 줄여주세요.");
                    resolve({ name: file.name, size: file.size, type: file.type, data: null, isLarge: true });
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => { resolve({ name: file.name, size: file.size, type: file.type, data: e.target.result, isLarge: false }); };
                reader.onerror = (e) => reject(e);
                reader.readAsDataURL(file);
            });
        }

        async function getPosts(collectionName) {
            if (!db) { alert("데이터베이스 연결 끊김"); return []; }
            try {
                const q = query(collection(db, collectionName));
                const querySnapshot = await getDocs(q);
                const posts = [];
                querySnapshot.forEach((doc) => { posts.push({ id: doc.id, ...doc.data() }); });
                return posts;
            } catch (e) {
                console.error(e); return [];
            }
        }

        async function savePost(collectionName, data) {
            if (!db) { alert("데이터베이스 연결 실패"); return null; }
            try {
                if (data.id) {
                    const docRef = doc(db, collectionName, String(data.id));
                    await setDoc(docRef, data, { merge: true });
                } else {
                    const newId = String(Date.now());
                    data.id = newId;
                    await setDoc(doc(db, collectionName, newId), data);
                }
                return data;
            } catch (e) {
                alert(`저장 실패: ${e.message}`); return null;
            }
        }

        async function deletePost(boardKey, id) {
            if (!db) return;
            try {
                await deleteDoc(doc(db, boardKey, String(id)));
                return true;
            } catch (e) {
                alert("삭제 오류: " + e.message); return false;
            }
        }

        async function getComments(boardKey, postId) {
            if (!db) return [];
            try {
                const q = query(collection(db, boardKey, String(postId), "comments"), orderBy("date", "asc"));
                const querySnapshot = await getDocs(q);
                const comments = [];
                querySnapshot.forEach((doc) => { comments.push({ id: doc.id, ...doc.data() }); });
                return comments;
            } catch (e) {
                return [];
            }
        }

        async function addComment(boardKey, postId, comment) {
            if (!db) return;
            try {
                comment.date = new Date().toISOString().split('T')[0];
                await addDoc(collection(db, boardKey, String(postId), "comments"), comment);
            } catch (e) { console.error(e); }
        }

        async function getPost(collectionName, id) {
            if (!db) return null;
            try {
                const docRef = doc(db, collectionName, String(id));
                const docSnap = await getDocs(query(collection(db, collectionName)));
                let result = null;
                docSnap.forEach((d) => {
                    if (d.id === String(id)) {
                        result = { id: d.id, ...d.data() };
                    }
                });
                return result;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function loadReviewComments(postId) {
            try {
                const comments = await getComments(COMM_KEYS.REVIEW, postId);
                const listDiv = document.getElementById('review-comments-list');
                if (!listDiv) return;

                if (comments.length === 0) {
                    listDiv.innerHTML = '<p style="color:#999; padding:10px;">등록된 댓글이 없습니다.</p>';
                } else {
                    let html = '';
                    comments.forEach(c => {
                        html += `<div style="border-bottom:1px solid #eee; padding:8px 0;">
                            <strong>${c.author}</strong> <span style="color:#999; font-size:0.9em;">${c.date}</span>
                            <p style="margin:5px 0 0 0;">${c.content}</p>
                        </div>`;
                    });
                    listDiv.innerHTML = html;
                }
            } catch (e) {
                console.error("댓글 로딩 오류:", e);
            }
        }

        // --- Admin Page Logic ---

        let currentAuthUser = null;
        let noticeList = [];
        let inquiryList = [];
        let reviewList = [];

        let currentEditId = null;
        let currentReplyId = null;
        let deleteTargetId = null;
        let deleteTargetBoard = null;

        async function renderAll() {
            // Fetch All
            noticeList = await getPosts(COMM_KEYS.NOTICE);
            inquiryList = await getPosts(COMM_KEYS.INQUIRY);
            reviewList = await getPosts(COMM_KEYS.REVIEW);

            // Dashboard
            const inqCount = document.getElementById('dash-inquiry-count');
            if (inqCount) inqCount.innerText = inquiryList.length;

            const revCount = document.getElementById('dash-review-count');
            if (revCount) revCount.innerText = reviewList.length;

            // Notice Table
            const noticeTbody = document.getElementById('notice-list');
            if (noticeTbody) {
                if (noticeList.length === 0) {
                    noticeTbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">등록된 공지사항이 없습니다.</td></tr>';
                } else {
                    let html = '';
                    noticeList.forEach(n => {
                        html += `<tr>
                            <td>${n.title}</td>
                            <td>${n.date}</td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="window.showNoticeForm('${n.id}')">수정</button>
                                <button class="btn btn-danger btn-sm" onclick="window.askDelete('${COMM_KEYS.NOTICE}', '${n.id}')">삭제</button>
                            </td>
                        </tr>`;
                    });
                    noticeTbody.innerHTML = html;
                }
            }

            // Inquiry Table
            const inquTbody = document.getElementById('inquiry-list');
            if (inquTbody) {
                if (inquiryList.length === 0) {
                    inquTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">접수된 활동사항이 없습니다.</td></tr>';
                } else {
                    let html = '';
                    inquiryList.forEach(q => {
                        const statusColor = q.status === '답변완료' ? 'blue' : 'red';
                        html += `<tr>
                            <td>${q.author}</td>
                            <td>${q.title}</td>
                            <td><span style="color:${statusColor}">${q.status || '답변대기'}</span></td>
                            <td>${q.date}</td>
                            <td>
                                <button class="btn btn-success btn-sm" onclick="window.showReplyForm('${q.id}')">답변</button>
                                <button class="btn btn-danger btn-sm" onclick="window.askDelete('${COMM_KEYS.INQUIRY}', '${q.id}')">삭제</button>
                            </td>
                        </tr>`;
                    });
                    inquTbody.innerHTML = html;
                }
            }

            // Review Table
            const reviewTbody = document.getElementById('review-list');
            if (reviewTbody) {
                if (reviewList.length === 0) {
                    reviewTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">등록된 후기가 없습니다.</td></tr>';
                } else {
                    let html = '';
                    reviewList.forEach(r => {
                        html += `<tr>
                            <td>${r.title}</td>
                            <td>${r.author}</td>
                            <td>${r.date}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="window.showReviewDetail('${r.id}')">상세/답변</button>
                                <button class="btn btn-danger btn-sm" onclick="window.askDelete('${COMM_KEYS.REVIEW}', '${r.id}')">삭제</button>
                            </td>
                        </tr>`;
                    });
                    reviewTbody.innerHTML = html;
                }
            }
        }

        // --- Global Exposure for Inline Calls ---
        // Since we are in a module, we MUST explicitly attach to window to use in onclick attributes
        window.renderAll = renderAll;

        window.showReviewDetail = function (id) {
            currentReplyId = id;
            const r = reviewList.find(item => item.id == id);
            if (r) {
                $('#review-detail-title').text(r.title);
                $('#review-detail-author').text(r.author + ' (' + r.date + ')');
                $('#review-detail-content').text(r.content);
                if (r.file) {
                    if (r.file.data) {
                        $('#review-detail-image').html(`<img src="${r.file.data}" style="max-width:100%; margin-top:10px;">`);
                    } else if (r.file.url) {
                        $('#review-detail-image').html(`<img src="${r.file.url}" style="max-width:100%; margin-top:10px;">`);
                    } else {
                        $('#review-detail-image').html(`<p>첨부파일: ${r.file.name}</p>`);
                    }
                } else {
                    $('#review-detail-image').empty();
                }
                $('#review-reply-content').val('');
                $('#review-detail-modal').css('display', 'flex');
                loadReviewComments(id);
            }
        }

        window.saveReviewReplyBtn = async function () {
            const content = $('#review-reply-content').val();
            if (!content) return alert('답변 내용을 입력하세요.');
            await addComment(COMM_KEYS.REVIEW, currentReplyId, { author: '관리자', content: content, password: '' });
            alert('답변(댓글)이 등록되었습니다.');
            $('#review-reply-content').val('');
            loadReviewComments(currentReplyId);
        }

        window.showNoticeForm = async function (id = null) {
            currentEditId = id;
            if (id) {
                const n = noticeList.find(item => item.id == id); // string comparison safe
                if (n) {
                    $('#notice-modal-title').text('공지사항 수정');
                    $('#notice-title').val(n.title);
                    $('#notice-content').val(n.content);
                    $('#notice-file-preview').html(n.file ? `<img src="${n.file.data || ''}" style="max-height:50px;"> 기존파일존재` : '');
                }
            } else {
                $('#notice-modal-title').text('공지사항 작성');
                $('#notice-title').val('');
                $('#notice-content').val('');
                $('#notice-file-preview').html('');
            }
            $('#notice-file').val('');
            $('#notice-form-modal').css('display', 'flex');
        }

        window.saveNoticeBtn = async function () {
            const title = $('#notice-title').val();
            const content = $('#notice-content').val();
            const fileInput = document.getElementById('notice-file');
            if (!title) return alert('제목을 입력하세요.');
            let fileData = null;
            if (fileInput.files.length > 0) {
                fileData = await readFile(fileInput.files[0]);
            } else if (currentEditId) {
                const old = noticeList.find(n => n.id == currentEditId);
                if (old) fileData = old.file;
            }
            const notice = { id: currentEditId || null, title: title, content: content, author: '관리자', date: new Date().toISOString().split('T')[0], file: fileData };
            await savePost(COMM_KEYS.NOTICE, notice);
            alert('저장되었습니다.');
            $('#notice-form-modal').hide();
            renderAll();
        }

        window.showReplyForm = function (id) {
            currentReplyId = id;
            const q = inquiryList.find(i => i.id == id);
            if (q) {
                $('#reply-inq-title').text(q.title);
                $('#reply-inq-content').text(q.content);
                $('#reply-content').val('');
                $('#reply-form-modal').css('display', 'flex');
            }
        }

        window.saveReplyBtn = async function () {
            const content = $('#reply-content').val();
            if (!content) return alert('내용을 입력하세요.');
            await addComment(COMM_KEYS.INQUIRY, currentReplyId, { author: '관리자', content: content, password: '' });
            const post = await getPost(COMM_KEYS.INQUIRY, currentReplyId);
            if (post) { post.status = '답변완료'; await savePost(COMM_KEYS.INQUIRY, post); }
            alert('답변이 등록되었습니다.');
            $('#reply-form-modal').hide();
            renderAll();
        }

        window.askDelete = function (boardKey, id) {
            deleteTargetBoard = boardKey;
            deleteTargetId = id;
            $('#delete-confirm-modal').css('display', 'flex');
        }

        window.confirmDelete = async function () {
            if (deleteTargetBoard && deleteTargetId) {
                await deletePost(deleteTargetBoard, deleteTargetId);
                $('#delete-confirm-modal').hide();
                renderAll();
            }
        }

        window.runAutoCleanup = async function (btn) {
            console.log("Auto cleanup started");
            if (!confirm("제목에 'test', '테스트', '123' 등이 포함된 테스트성 게시물을 자동으로 찾아 삭제하시겠습니까?\n(삭제 후 복구할 수 없습니다.)")) return;
            const originalText = btn.innerText;
            btn.innerText = "삭제 진행 중...";
            btn.disabled = true;

            const collections = [
                { key: COMM_KEYS.NOTICE, name: '공지사항' },
                { key: COMM_KEYS.INQUIRY, name: '활동사항' },
                { key: COMM_KEYS.REVIEW, name: '사용후기' }
            ];

            let count = 0;
            try {
                for (const col of collections) {
                    const posts = await getPosts(col.key);
                    for (const p of posts) {
                        const title = (p.title || '').toLowerCase();
                        const isTest = title.includes('test') || title.includes('테스트') || title === '123' || title === 't';
                        if (isTest) {
                            try {
                                await deletePost(col.key, p.id);
                                console.log(`Deleted ${col.name}: ${p.title}`);
                                count++;
                            } catch (err) { console.error(err); }
                        }
                    }
                }
                alert(`총 ${count}개의 테스트 데이터를 삭제했습니다.`);
            } catch (e) {
                alert("오류 발생: " + e.message); console.error(e);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                if (window.renderAll) window.renderAll();
            }
        };

        // Navigation Tab Logic
        $('.nav-link').click(function (e) {
            const href = $(this).attr('href');
            if (href.startsWith('#')) {
                e.preventDefault();
                $('.nav-link').removeClass('active');
                $(this).addClass('active');
                $('.page-section').hide();
                $('#' + $(this).data('target')).show();
            }
        });

        // Trigger additional event listeners
        window.tryLogout = function () {
            if (confirm('관리자 로그아웃 하시겠습니까?')) {
                location.reload();
            }
        }

    </script>
</body>

</html>
