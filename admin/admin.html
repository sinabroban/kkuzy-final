<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>꾸지뽕사업단 관리자 (Standalone)</title>
    <meta name="viewport" content="width=1280">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/jquery-2.1.4.min.js"></script>
    <style>
        body {
            background: #f4f6f9;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .admin-wrap {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #343a40;
            color: #fff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: bold;
            border-bottom: 1px solid #4b545c;
        }

        .nav-link {
            display: block;
            padding: 15px 20px;
            color: #c2c7d0;
            text-decoration: none;
            border-bottom: 1px solid #4b545c;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #494e53;
            color: #fff;
        }

        .content {
            flex-grow: 1;
            padding: 30px;
        }

        .card {
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 0 1px rgba(0, 0, 0, .125), 0 1px 3px rgba(0, 0, 0, .2);
            margin-bottom: 20px;
        }

        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, .125);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .card-body {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .btn {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
        }

        .btn-primary {
            background: #007bff;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea.form-control {
            height: 150px;
            resize: vertical;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #343a40;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
    </style>

    <script>
        // FAILSAFE: Global Login Function - Defined early to ensure availability
        window.triggerRender = function () {
            if (window.renderAll && typeof window.renderAll === 'function') {
                window.renderAll();
            }
        }

        // Window Functions - Defined in HEAD to guarantee definition
        window.tryLogin = function () {
            const input = document.getElementById('admin-password');
            const pw = input.value.trim();

            if (!pw) return alert('비밀번호를 입력하세요.');

            if (pw === '4321') {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-main').style.filter = 'none';
                window.isLoggedIn = true;
                if (window.triggerRender) window.triggerRender();
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                input.value = '';
                input.focus();
            }
        }
    </script>
</head>

<body>

            <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;" type="button"

    <!-- Community Firebase Logic -->
    <script src="../js/community_firebase.js?v=20251224_admin"></script>

    <!-- Admin Page Logic -->
    <script>
        // Wait for Firebase to initialize
        setTimeout(function () {
            // Access global functions from community_firebase.js
            const getPosts = window.getPosts;
            const savePost = window.savePost;
            const deletePost = window.deletePost;
            const uploadFile = window.uploadFile;
            const addComment = window.addComment;
            const getComments = window.getComments;
            const getPost = window.getPost;
            const COMM_KEYS = window.COMM_KEYS;

            // Admin Page Logic Variables
            let noticeList = [];
            let inquiryList = [];
            let reviewList = [];
            let orderList = [];
            let currentEditId = null;
            let currentReplyId = null;
            let currentOrderId = null;
            let deleteTargetId = null;
            let deleteTargetBoard = null;

            // Render Function
            async function renderAll() {
                try {
                    // Fetch All
                    noticeList = await getPosts(COMM_KEYS.NOTICE);
                    inquiryList = await getPosts(COMM_KEYS.INQUIRY);
                    reviewList = await getPosts(COMM_KEYS.REVIEW);

                    // Dashboard
                    const inqCount = document.getElementById('dash-inquiry-count');
                    if (inqCount) inqCount.innerText = inquiryList.length;

                    const revCount = document.getElementById('dash-review-count');
                    if (revCount) revCount.innerText = reviewList.length;

                    // Load and render orders
                    renderOrders();

                    // Notice Table
                    const noticeTbody = document.getElementById('notice-list');
                    if (noticeTbody) {
                        if (noticeList.length === 0) {
                            noticeTbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">등록된 공지사항이 없습니다.</td></tr>';
                        } else {
                            let html = '';
                            // Sort by date desc
                            noticeList.sort((a, b) => new Date(b.date) - new Date(a.date));
                            noticeList.forEach(n => {
                                html += `<tr>
                                <td>${n.title}</td>
                                <td>${n.date}</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" onclick="window.showNoticeForm('${n.id}')">수정</button>
                                    <button class="btn btn-danger btn-sm" onclick="window.askDelete('${COMM_KEYS.NOTICE}', '${n.id}')">삭제</button>
                                </td>
                            </tr>`;
                            });
                            noticeTbody.innerHTML = html;
                        }
                    }

                    // Inquiry Table
                    const inquTbody = document.getElementById('inquiry-list');
                    if (inquTbody) {
                        if (inquiryList.length === 0) {
                            inquTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">접수된 활동사항이 없습니다.</td></tr>';
                        } else {
                            let html = '';
                            inquiryList.sort((a, b) => new Date(b.date) - new Date(a.date));
                            inquiryList.forEach(q => {
                                const statusColor = q.status === '답변완료' ? 'blue' : 'red';
                                html += `<tr>
                                <td>${q.author}</td>
                                <td>${q.title} ${q.secret ? '<span style="color:red; font-size:0.8em;">(비밀)</span>' : ''}</td>
                                <td><span style="color:${statusColor}">${q.status || '답변대기'}</span></td>
                                <td>${q.date}</td>
                                <td>
                                    <button class="btn btn-success btn-sm" onclick="window.showReplyForm('${q.id}')">답변</button>
                                    <button class="btn btn-danger btn-sm" onclick="window.askDelete('${COMM_KEYS.INQUIRY}', '${q.id}')">삭제</button>
                                </td>
                            </tr>`;
                            });
                            inquTbody.innerHTML = html;
                        }
                    }

                    // Review Table
                    const reviewTbody = document.getElementById('review-list');
                    if (reviewTbody) {
                        if (reviewList.length === 0) {
                            reviewTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">등록된 후기가 없습니다.</td></tr>';
                        } else {
                            let html = '';
                            reviewList.sort((a, b) => new Date(b.date) - new Date(a.date));
                            reviewList.forEach(r => {
                                html += `<tr>
                                <td>${r.title}</td>
                                <td>${r.author}</td>
                                <td>${r.date}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="window.showReviewDetail('${r.id}')">상세/답변</button>
                                    <button class="btn btn-danger btn-sm" onclick="window.askDelete('${COMM_KEYS.REVIEW}', '${r.id}')">삭제</button>
                                </td>
                            </tr>`;
                            });
                            reviewTbody.innerHTML = html;
                        }
                    }
                } catch (err) {
                    console.error("Render Error:", err);
                    // alert("데이터 로딩 중 오류가 발생했습니다.");
                }
            }

            // Order Management Functions
            function renderOrders() {
                try {
                    orderList = JSON.parse(localStorage.getItem('kkuzy_orders')) || [];

                    // Update dashboard count
                    const orderCount = document.getElementById('dash-order-count');
                    if (orderCount) orderCount.innerText = orderList.length;

                    // Render order table
                    const orderTbody = document.getElementById('order-list');
                    if (orderTbody) {
                        if (orderList.length === 0) {
                            orderTbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">접수된 주문이 없습니다.</td></tr>';
                        } else {
                            let html = '';
                            // Sort by date desc (newest first)
                            orderList.sort((a, b) => {
                                const idA = parseInt(a.id.split('-')[1]) || 0;
                                const idB = parseInt(b.id.split('-')[1]) || 0;
                                return idB - idA;
                            });

                            orderList.forEach(order => {
                                const statusColor = getStatusColor(order.status || '입금대기');
                                const shortId = order.id.substring(4, 14); // Show shorter ID
                                html += `<tr>
                                    <td>${shortId}</td>
                                    <td>${order.name}</td>
                                    <td>${order.phone}</td>
                                    <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${order.product}</td>
                                    <td>${order.price}</td>
                                    <td><span style="color:${statusColor}; font-weight:bold;">${order.status || '입금대기'}</span></td>
                                    <td>${order.date}</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm" onclick="window.showOrderDetail('${order.id}')">상세</button>
                                        <button class="btn btn-danger btn-sm" onclick="window.askDeleteOrder('${order.id}')">삭제</button>
                                    </td>
                                </tr>`;
                            });
                            orderTbody.innerHTML = html;
                        }
                    }
                } catch (err) {
                    console.error("Order Render Error:", err);
                }
            }

            function getStatusColor(status) {
                const colors = {
                    '입금대기': '#dc3545',
                    '입금확인': '#ffc107',
                    '배송중': '#007bff',
                    '배송완료': '#28a745'
                };
                return colors[status] || '#666';
            }

            window.showOrderDetail = function (orderId) {
                currentOrderId = orderId;
                const order = orderList.find(o => o.id === orderId);
                if (!order) return;

                $('#order-detail-id').text(order.id);
                $('#order-detail-date').text(order.date);
                $('#order-detail-name').text(order.name);
                $('#order-detail-phone').text(order.phone);
                $('#order-detail-address').text(order.address || '-');
                $('#order-detail-product').text(order.product);
                $('#order-detail-price').text(order.price);
                $('#order-detail-payment').text(order.paymentMethod || '계좌이체');
                $('#order-detail-request').text(order.request || '없음');

                const status = order.status || '입금대기';
                const statusColor = getStatusColor(status);
                $('#order-status-current').html(`현재 상태: <span style="color:${statusColor};">${status}</span>`);

                $('#order-detail-modal').css('display', 'flex');
            }

            window.updateOrderStatusBtn = function (newStatus) {
                if (!currentOrderId) return;

                try {
                    const orders = JSON.parse(localStorage.getItem('kkuzy_orders')) || [];
                    const order = orders.find(o => o.id === currentOrderId);
                    if (order) {
                        order.status = newStatus;
                        localStorage.setItem('kkuzy_orders', JSON.stringify(orders));
                        alert(`주문 상태가 "${newStatus}"로 변경되었습니다.`);
                        $('#order-detail-modal').hide();
                        renderOrders();
                    }
                } catch (err) {
                    alert('상태 변경 중 오류가 발생했습니다: ' + err.message);
                    console.error(err);
                }
            }

            window.askDeleteOrder = function (orderId) {
                if (confirm('이 주문을 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.')) {
                    try {
                        let orders = JSON.parse(localStorage.getItem('kkuzy_orders')) || [];
                        orders = orders.filter(o => o.id !== orderId);
                        localStorage.setItem('kkuzy_orders', JSON.stringify(orders));
                        alert('주문이 삭제되었습니다.');
                        renderOrders();
                    } catch (err) {
                        alert('삭제 중 오류가 발생했습니다: ' + err.message);
                        console.error(err);
                    }
                }
            }

            // Attach renderAll to window
            window.renderAll = renderAll;

            // --- Helper Functions attached to Window ---


            window.showReviewDetail = function (id) {
                currentReplyId = id;
                const r = reviewList.find(item => item.id == id);
                if (r) {
                    $('#review-detail-title').text(r.title);
                    $('#review-detail-author').text(r.author + ' (' + r.date + ')');
                    $('#review-detail-content').text(r.content);

                    let fileHtml = '';
                    const render = (f, label) => {
                        if (!f) return '';
                        const url = f.url || f.data;
                        if (!url) return `<p>${label}: ${f.name} (Error)</p>`;
                        if (f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                            return `<img src="${url}" style="max-width:100%; margin-top:10px; display:block;">`;
                        } else {
                            return `<p>${label}: <a href="${url}" target="_blank">${f.name}</a></p>`;
                        }
                    };

                    if (r.file) fileHtml += render(r.file, '첨부1');
                    // Only file (file2 removed)

                    $('#review-detail-image').html(fileHtml);

                    $('#review-reply-content').val('');
                    $('#review-detail-modal').css('display', 'flex');
                    loadReviewComments(id);
                }
            }

            window.saveReviewReplyBtn = async function () {
                const content = $('#review-reply-content').val();
                if (!content) return alert('답변 내용을 입력하세요.');
                await addComment(COMM_KEYS.REVIEW, currentReplyId, { author: '관리자', content: content, password: '' });
                alert('답변(댓글)이 등록되었습니다.');
                $('#review-reply-content').val('');
                loadReviewComments(currentReplyId);
            }

            window.showNoticeForm = async function (id = null) {
                currentEditId = id;
                if (id) {
                    const n = noticeList.find(item => item.id == id);
                    if (n) {
                        $('#notice-modal-title').text('공지사항 수정');
                        $('#notice-title').val(n.title);
                        $('#notice-content').val(n.content);

                        const renderPrev = (f) => f ? `<img src="${f.url || f.data}" style="max-height:50px;"> ${f.name}` : '';
                        $('#notice-file-preview').html(renderPrev(n.file));
                        $('#notice-file-preview2').html(renderPrev(n.file2));
                    }
                } else {
                    $('#notice-modal-title').text('공지사항 작성');
                    $('#notice-title').val('');
                    $('#notice-content').val('');
                    $('#notice-file-preview').html('');
                    $('#notice-file-preview2').html('');
                }
                $('#notice-file').val('');
                $('#notice-form-modal').css('display', 'flex');
            }

            window.saveNoticeBtn = async function () {
                const title = $('#notice-title').val();
                const content = $('#notice-content').val();
                const fileInput = document.getElementById('notice-file');
                const fileInput2 = document.getElementById('notice-file2');

                if (!title) return alert('제목을 입력하세요.');

                const btn = document.querySelector('#notice-form-modal .btn-success');
                const orgText = btn.innerText;
                btn.innerText = "저장 중...";
                btn.disabled = true;

                try {
                    let notice;

                    if (currentEditId) {
                        // 수정 모드: 기존 게시물의 모든 필드를 보존
                        const old = noticeList.find(n => n.id == currentEditId);
                        if (old) {
                            // 기존 객체를 복사하여 모든 필드 보존 (hits, file2 등 모든 필드)
                            notice = { ...old };
                            // 수정된 필드만 업데이트
                            notice.title = title;
                            notice.content = content;

                            // 파일1이 새로 선택된 경우만 업데이트
                            if (fileInput.files.length > 0) {
                                btn.innerText = "파일1 업로드 중...";
                                try {
                                    notice.file = await uploadFile(fileInput.files[0]);
                                } catch (e) {
                                    alert("파일1 업로드 실패: " + e.message);
                                    btn.innerText = orgText;
                                    btn.disabled = false;
                                    return;
                                }
                            }

                            // 파일2가 새로 선택된 경우만 업데이트
                            if (fileInput2.files.length > 0) {
                                btn.innerText = "파일2 업로드 중...";
                                try {
                                    notice.file2 = await uploadFile(fileInput2.files[0]);
                                } catch (e) {
                                    alert("파일2 업로드 실패: " + e.message);
                                    btn.innerText = orgText;
                                    btn.disabled = false;
                                    return;
                                }
                            }
                            // 파일을 선택하지 않았으면 기존 file/file2 값 유지 (이미 ...old로 복사됨)
                        } else {
                            // 기존 게시물을 찾을 수 없는 경우
                            alert('게시물을 찾을 수 없습니다.');
                            btn.innerText = orgText;
                            btn.disabled = false;
                            return;
                        }
                    } else {
                        // 새 글 작성 모드: 필수 필드만 설정
                        let fileData = null;
                        if (fileInput.files.length > 0) {
                            btn.innerText = "파일1 업로드 중...";
                            try {
                                fileData = await uploadFile(fileInput.files[0]);
                            } catch (e) {
                                alert("파일1 업로드 실패: " + e.message);
                                btn.innerText = orgText;
                                btn.disabled = false;
                                return;
                            }
                        }

                        let fileData2 = null;
                        if (fileInput2.files.length > 0) {
                            btn.innerText = "파일2 업로드 중...";
                            try {
                                fileData2 = await uploadFile(fileInput2.files[0]);
                            } catch (e) {
                                alert("파일2 업로드 실패: " + e.message);
                                btn.innerText = orgText;
                                btn.disabled = false;
                                return;
                            }
                        }

                        notice = {
                            id: null,
                            title: title,
                            content: content,
                            author: '관리자',
                            date: new Date().toISOString().split('T')[0],
                            file: fileData,
                            file2: fileData2,
                            hits: 0
                        };
                    }

                    await savePost(COMM_KEYS.NOTICE, notice);
                    alert('저장되었습니다.');
                    $('#notice-form-modal').hide();
                    renderAll();
                } catch (err) {
                    alert("오류: " + err.message);
                } finally {
                    btn.innerText = orgText;
                    btn.disabled = false;
                }
            }

            window.showReplyForm = function (id) {
                currentReplyId = id;
                const q = inquiryList.find(i => i.id == id);
                if (q) {
                    $('#reply-inq-title').text(q.title);
                    $('#reply-inq-content').text(q.content);

                    const render = (f) => f ? `<div style="margin-top:5px;"><a href="${f.url || f.data}" target="_blank">📄 ${f.name}</a></div>` : '';
                    let fileHtml = '';
                    if (q.file) fileHtml += render(q.file);
                    // Only file (file2 removed)
                    $('#reply-inq-files').html(fileHtml);

                    $('#reply-content').val('');
                    $('#reply-form-modal').css('display', 'flex');
                }
            }

            window.saveReplyBtn = async function () {
                const content = $('#reply-content').val();
                if (!content) return alert('내용을 입력하세요.');
                await addComment(COMM_KEYS.INQUIRY, currentReplyId, { author: '관리자', content: content, password: '' });
                const post = await getPost(COMM_KEYS.INQUIRY, currentReplyId);
                if (post) { post.status = '답변완료'; await savePost(COMM_KEYS.INQUIRY, post); }
                alert('답변이 등록되었습니다.');
                $('#reply-form-modal').hide();
                renderAll();
            }

            window.askDelete = function (boardKey, id) {
                deleteTargetBoard = boardKey;
                deleteTargetId = id;
                $('#delete-confirm-modal').css('display', 'flex');
            }

            window.confirmDelete = async function () {
                if (deleteTargetBoard && deleteTargetId) {
                    await deletePost(deleteTargetBoard, deleteTargetId);
                    $('#delete-confirm-modal').hide();
                    renderAll();
                }
            }

            window.runAutoCleanup = async function (btn) {
                console.log("Auto cleanup started");
                if (!confirm("제목에 'test', '테스트', '123' 등이 포함된 테스트성 게시물을 자동으로 찾아 삭제하시겠습니까?\n(삭제 후 복구할 수 없습니다.)")) return;
                const originalText = btn.innerText;
                btn.innerText = "삭제 진행 중...";
                btn.disabled = true;

                const collections = [
                    { key: COMM_KEYS.NOTICE, name: '공지사항' },
                    { key: COMM_KEYS.INQUIRY, name: '활동사항' },
                    { key: COMM_KEYS.REVIEW, name: '사용후기' }
                ];

                let count = 0;
                try {
                    for (const col of collections) {
                        const posts = await getPosts(col.key);
                        for (const p of posts) {
                            const title = (p.title || '').toLowerCase();
                            const isTest = title.includes('test') || title.includes('테스트') || title === '123' || title === 't';
                            if (isTest) {
                                try {
                                    await deletePost(col.key, p.id);
                                    console.log(`Deleted ${col.name}: ${p.title}`);
                                    count++;
                                } catch (err) { console.error(err); }
                            }
                        }
                    }
                    alert(`총 ${count}개의 테스트 데이터를 삭제했습니다.`);
                } catch (e) {
                    alert("오류 발생: " + e.message); console.error(e);
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    if (window.renderAll) window.renderAll();
                }
            };

            // Navigation Tab Logic
            $('.nav-link').click(function (e) {
                const href = $(this).attr('href');
                if (href.startsWith('#')) {
                    e.preventDefault();
                    $('.nav-link').removeClass('active');
                    $(this).addClass('active');
                    $('.page-section').hide();
                    $('#' + $(this).data('target')).show();
                }
            });

            // Trigger additional event listeners
            window.tryLogout = function () {
                if (confirm('관리자 로그아웃 하시겠습니까?')) {
                    location.reload();
                }
            }

            // Trigger initial render after login
            if (window.isLoggedIn) {
                renderAll();
            }
        }, 1000); // Wait for Firebase init
    </script>
</body>

</html>
